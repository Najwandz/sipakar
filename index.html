<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIPAKAR — Sistem Informasi Pemantauan & Perbandingan Harga Komoditas Pangan</title>
  <link rel="icon" type="image/svg+xml" href="./assets/img/logo.svg" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">
  <!-- Navbar Container -->
  <header id="navbar-container" class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm"></header>

  <!-- Main Content Container -->
  <main id="app-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div class="flex items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-emerald-600 border-t-transparent"></div>
      <span class="ml-3 text-slate-600 font-medium">Memuat sistem SIPAKAR...</span>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-t border-slate-200 mt-12 no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-500">
      <div>
        <span class="font-semibold text-slate-700">SIPAKAR</span> — Sistem Informasi Pemantauan &amp; Perbandingan Harga Komoditas Pangan di Pasar Lokal
      </div>
      <div class="text-xs text-slate-400 text-center sm:text-right">
        Kelompok Kelas CD Informatika UNSIL &bull; Arsitektur MVC Modular
      </div>
    </div>
  </footer>

  <!-- Login Modal Container -->
  <div id="modal-container"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Entry Point ES Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
